<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة أهداف الذهب</title>
<style>
:root{--bg:#0e1320;--card:#161d2e;--line:#2a3550;--txt:#eef1f8;--mut:#8f9bb5;--gold:#f5c451;--pos:#2ecc8f;--acc:#4da3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1d2742,var(--bg) 60%);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6;padding:20px 14px}
.wrap{max-width:640px;margin:0 auto}
h1{margin:0 0 4px;font-size:22px;text-align:center}
.sub{margin:0 0 18px;color:var(--mut);font-size:13px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
input{width:100%;background:#0e1524;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px;font-size:18px;font-weight:600;direction:ltr;text-align:center}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.hint{font-size:11px;color:var(--mut);margin-top:2px}
.adv{margin-top:12px;font-size:12px;color:var(--mut)}
.adv summary{cursor:pointer}
.adv .inputs{margin-top:10px}
.total{text-align:center;background:linear-gradient(135deg,#2a2410,#1d2a1f);border:1px solid #5b4b1d}
.total small{color:var(--mut);font-size:13px}
.total .v{font-size:44px;font-weight:800;color:var(--gold);direction:ltr;display:block;line-height:1.2}
.total .d{font-size:13px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{background:#0e1524;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut)}
.chip b{color:var(--txt);direction:ltr;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:12px;font-weight:600}
td{direction:ltr}
tr:last-child td{border-bottom:0;font-weight:700}
.pos{color:var(--pos)}
.err{background:#3a1820;border:1px solid #ff5d6c;color:#ffb3bb;padding:10px;border-radius:10px;text-align:center}
.note{color:var(--mut);font-size:12px;text-align:center;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
<h1>حاسبة أهداف الذهب</h1>
<p class="sub">كم يكون الربح لو حققت الصفقة كل أهدافها؟</p>

<div class="card">
<div class="inputs">
<label>حجم الصفقة (لوت)<input id="lot" type="number" step="0.01" min="0.01" value="0.05" inputmode="decimal"></label>
<label>عدد الأجزاء<input id="splits" type="number" step="1" min="1" value="5" inputmode="numeric"></label>
<label>الهدف كل (دولار)<input id="gap" type="number" step="0.1" min="0.01" value="3" inputmode="decimal"><span class="hint">مسافة تراكمية: 3 ثم 6 ثم 9...</span></label>
<label>ربح 1$ حركة لكل 1 لوت<input id="per" type="number" step="1" min="1" value="100" inputmode="decimal"><span class="hint">الذهب = 100$</span></label>
</div>
<details class="adv"><summary>خيارات إضافية</summary>
<div class="inputs">
<label>سعر الدخول (اختياري)<input id="entry" type="number" step="0.01" placeholder="مثال 2000" inputmode="decimal"></label>
<label>أقل لوت / الخطوة<input id="step" type="number" step="0.01" min="0.01" value="0.01" inputmode="decimal"></label>
</div></details>
</div>

<div id="err"></div>

<div class="card total">
<small>إجمالي الربح عند آخر هدف</small>
<span class="v" id="total">0.00$</span>
<span class="d" id="desc"></span>
<div class="chips" id="chips"></div>
</div>

<div class="card">
<table><thead><tr><th>الهدف</th><th>الحركة</th><th id="thPrice">السعر</th><th>لوت الجزء</th><th>ربح الجزء</th><th>تراكمي</th></tr></thead><tbody id="rows"></tbody></table>
<p class="note">حساب نظري للصعود (شراء) بدون سبريد أو عمولة أو سواب.</p>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(v,d=2)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

// الحساب بالأعداد الصحيحة (وحدات الخطوة والسنتات) لتفادي أخطاء الفاصلة العشرية
function calc(lot,splits,gap,per,step){
  const units=Math.round(lot/step);
  if(units<1)return{error:'حجم الصفقة أقل من أقل لوت.'};
  let n=Math.min(splits,units);
  const base=Math.floor(units/n);
  const parts=[];
  let left=units,cum=0;
  for(let j=1;j<=n;j++){
    const u=j===n?left:base;
    left-=u;
    const vol=u*step;
    const move=gap*j;
    const profit=Math.round(move*vol*per*100)/100;
    cum=Math.round((cum+profit)*100)/100;
    parts.push({j,move,vol,profit,cum});
  }
  return{parts,total:cum,usedSplits:n,reduced:n<splits};
}

function render(){
  const lot=parseFloat($('lot').value),splits=Math.floor(parseFloat($('splits').value)),
    gap=parseFloat($('gap').value),per=parseFloat($('per').value),
    step=parseFloat($('step').value),entry=parseFloat($('entry').value);
  const bad=![lot,splits,gap,per,step].every(Number.isFinite)||lot<=0||splits<1||gap<=0||per<=0||step<=0;
  if(bad){$('err').innerHTML='<div class="err">أدخل أرقام صحيحة أكبر من صفر في كل الحقول.</div>';return}
  const r=calc(lot,splits,gap,per,step);
  if(r.error){$('err').innerHTML=`<div class="err">${r.error}</div>`;return}
  $('err').innerHTML='';
  const hasEntry=Number.isFinite(entry);
  $('total').textContent=fmt(r.total)+'$';
  const last=r.parts[r.parts.length-1];
  $('desc').textContent=`${fmt(lot)} لوت على ${r.usedSplits} أجزاء، آخر هدف عند حركة ${fmt(last.move,2)}$`+(r.reduced?' (قُلّل عدد الأجزاء لأن اللوت صغير)':'');
  $('chips').innerHTML=
    `<span class="chip">ربح أول هدف <b>${fmt(r.parts[0].profit)}$</b></span>`+
    `<span class="chip">متوسط الجزء <b>${fmt(r.total/r.usedSplits)}$</b></span>`+
    `<span class="chip">أقصى حركة <b>${fmt(last.move,2)}$</b></span>`;
  $('thPrice').textContent=hasEntry?'السعر':'';
  $('rows').innerHTML=r.parts.map(p=>`<tr><td>${p.j}</td><td>+${fmt(p.move,2)}</td><td>${hasEntry?fmt(entry+p.move):'-'}</td><td>${fmt(p.vol)}</td><td class="pos">+${fmt(p.profit)}</td><td class="pos">${fmt(p.cum)}</td></tr>`).join('');
}
document.addEventListener('input',render);
render();
</script>
</body>
</html>
